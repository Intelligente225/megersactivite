<title>Megers Activité</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--primary:#1769e0;--primary2:#0f4fae;--danger:#c62828;--ok:#16834b;--line:#e5eaf2;--shadow:0 8px 28px rgba(23,32,51,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0b3b83,#1769e0);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.head{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:23px;font-weight:800}.sub{opacity:.82;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700}.btn.light{background:#fff;color:#124f9e}.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
main{max-width:1400px;margin:22px auto;padding:0 18px}.tabs{display:flex;flex-direction:column;gap:0;overflow:visible;margin-bottom:18px;position:sticky;top:76px;z-index:4;padding:8px 0;background:var(--bg)}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.mainmenu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;order:0}.mainmenu .mainitem{flex:1 1 0;min-width:150px;text-align:center}.subtabs{order:1}.mainitem{border:1px solid var(--line);background:#fff;padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:800}.mainitem.active{background:var(--primary);color:#fff;border-color:var(--primary)}.subtabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.scanicon{width:38px;height:38px;padding:0;border:1px solid #d8deea;border-radius:9px;background:#fff;cursor:pointer;font-size:19px;vertical-align:middle}.seriesrow{display:flex;gap:7px;align-items:end}.seriesrow label{flex:1}.scanhelp{font-size:12px;color:var(--muted);margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:27px;font-weight:850;margin-top:6px}.metric .hint{font-size:12px;color:var(--muted);margin-top:5px}
.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap}.search,input,select,textarea{font:inherit}.search,input,select,textarea{border:1px solid #d8deea;border-radius:9px;padding:9px 10px;background:#fff;outline:none}.search:focus,input:focus,select:focus{border-color:var(--primary)}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f8fafc;font-size:12px;text-transform:uppercase;color:var(--muted)}.table tr:last-child td{border-bottom:0}.num{text-align:right!important}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4ff;color:#1458b0;font-size:12px;font-weight:700}
.rowgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.formgrid .wide{grid-column:span 2}.empty{padding:25px;text-align:center;color:var(--muted)}
.danger{color:var(--danger)}.ok{color:var(--ok)}.small{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{width:min(650px,100%);background:#fff;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;font-size:24px;cursor:pointer}.footer{padding:30px 0;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.rowgrid,.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.mainmenu .mainitem{min-width:0;padding:12px 8px;font-size:14px}}
@media print{header,.tabs,.actions,.toolbar button,.toolbar input,.footer{display:none!important}body{background:#fff}.card,.tablewrap{box-shadow:none}}

.chatbox{display:grid;grid-template-columns:280px 1fr;gap:14px}.chatmessages{height:430px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.chatmsg{padding:9px 11px;margin:7px 0;border-radius:12px;background:#fff;border:1px solid var(--line);max-width:85%}.chatmsg.me{margin-left:auto;background:#eef4ff}.chatmsg img,.chatmsg video{max-width:100%;border-radius:10px;margin-top:7px}.chatinput{display:flex;gap:8px;margin-top:10px}.chatinput textarea{flex:1;resize:vertical}.callbar{display:flex;gap:8px;flex-wrap:wrap}.sharelist{display:none;flex-direction:column;gap:6px;margin-top:8px;padding:8px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}.sharelist button{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;width:100%;background:#fff}.sharelist .shareicon{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:19px}.callvideo{width:100%;max-height:300px;background:#111;border-radius:12px}.chartwrap{position:relative;width:100%;overflow:auto}.chart{width:100%;height:340px;background:#fff;border:1px solid var(--line);border-radius:12px}.summaryfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.summaryfilters label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
@media(max-width:760px){.chatbox{grid-template-columns:1fr}.chatmessages{height:360px}}
.summary-card{position:relative}.summary-title{text-align:center;padding:8px 0 14px}.summary-title h1{margin:0;font-size:24px;letter-spacing:.4px;color:var(--text)}.summary-actions{display:flex;justify-content:center;margin:0 0 16px}.summary-actions .btn{font-weight:700;min-width:260px}.summary-card .section{margin-top:18px}.summary-card .section h2{margin-top:0}.summaryfilters{justify-content:center}.summaryfilters label{min-width:170px}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><style id="call-enhanced-style">#callPanel{margin-top:10px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#0b3b83,#1769e0);color:#fff;box-shadow:0 10px 30px #0002}#callPanel .callTitle{font-size:18px;font-weight:800}#callPanel .callSub{font-size:13px;opacity:.85;margin-top:4px}#callPanel .callControls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#callPanel .callControls button{border:0;border-radius:999px;padding:10px 13px;font-weight:800;cursor:pointer;background:#fff;color:#123}#callPanel .callControls button.danger{background:#ffdddd;color:#a00}#callPanel .callControls button.active{background:#ffd166;color:#222}</style>
<style>
/* Interface Chat inspirée de la maquette fournie */
body{background:linear-gradient(135deg,#edf5ff,#f7fbff);}
header{background:linear-gradient(110deg,#0b4caa,#1769e0);padding:18px 30px;}
.head{max-width:1500px;}
.brand{font-size:27px;letter-spacing:.2px;}
main{max-width:1500px;margin:12px auto;padding:0 24px;}
.tabs{position:static;display:flex;flex-direction:column;gap:10px;background:transparent;padding:0;margin-bottom:18px;}
.mainmenu{display:flex;gap:14px;flex-wrap:wrap;}
.mainmenu .mainitem{flex:0 1 175px;min-width:140px;padding:15px 18px;border-radius:15px;background:#fff;box-shadow:0 4px 14px rgba(23,32,51,.05);}
.mainmenu .mainitem.active{background:#1769e0;}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;overflow:auto;margin-bottom:18px;}
.chatbox{grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:stretch;}
.chatbox>.card{border-radius:18px;box-shadow:0 5px 22px rgba(23,32,51,.07);}
.chatmessages{height:560px;background:#f6faff;border:0;border-radius:0;padding:18px;}
.chatinput{padding:12px;background:#fff;border:1px solid var(--line);border-radius:18px;align-items:center;}
.chatinput textarea{border:0;background:transparent;min-height:42px;}
.chatinput textarea:focus{border:0;}
.callbar{background:linear-gradient(145deg,#075fe8,#1686f5);color:#fff;border-radius:18px;padding:15px;box-shadow:0 6px 20px rgba(23,105,224,.22);}
.callbar .btn{background:#fff;color:#1458b0;border-radius:25px;}
.callbar .btn.danger,.callbar button[onclick*="endCall"]{background:#ff4b55;color:#fff;}
@media(max-width:760px){main{padding:0 10px}.chatbox{grid-template-columns:1fr}.chatmessages{height:360px}.mainmenu .mainitem{flex:1 1 42%;}}
</style>

function normalizeDB(source){
  const base=JSON.parse(JSON.stringify(INITIAL));
  const input=(source&&typeof source==="object")?source:{};
  const merged={...base,...input};
  if(!Array.isArray(merged.sales)) merged.sales=[];
  if(!Array.isArray(merged.debts)) merged.debts=[];
  if(!Array.isArray(merged.deliveries)) merged.deliveries=[];
  if(!Array.isArray(merged.operations)) merged.operations=[];
  if(!Array.isArray(merged.usdTransactions)) merged.usdTransactions=[];
  return merged;
}

function persistLocal(){
  try{
    const data=JSON.stringify(db);
    localStorage.setItem(KEY,data);

async function initFirebase(){
 if(!window.firebase){console.warn('Firebase App non chargé.');return null;}
 try{
   if(typeof firebase.initializeApp!=='function') throw new Error('Firebase App Compat non chargé.');
   if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
   // L’utilisateur de l’application est déjà connecté avec le login local.
   // Pour que Firestore reconnaisse aussi cette session, on ouvre automatiquement
   // une session Firebase anonyme (à activer dans Firebase > Authentication > Méthode de connexion).
   if(firebase.auth){
     await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
     firebaseAuthReady=(async()=>{
       if(firebase.auth().currentUser)return firebase.auth().currentUser;
       try{return (await firebase.auth().signInAnonymously()).user;}
       catch(e){console.warn('Connexion Firebase anonyme impossible:',e);return null;}
     })();
     await firebaseAuthReady;
   }
   firestore=firebase.firestore();
   sharedDoc=firestore.collection("megers").doc("database");
   firebaseUnsubscribe=sharedDoc.onSnapshot(async (snap)=>{
     try{
       if(snap.exists){
         const raw=snap.data()||{};
         const keys=Object.keys(raw).filter(k=>k!=="initialized");
         // Si le document ne contient encore que le marqueur Firebase,
         // on conserve les données locales existantes et on les initialise dans le cloud.
         if(keys.length===0){
           db=normalizeDB(db);
           persistLocal();
           await sharedDoc.set({...db,initialized:true},{merge:true});
         }else{
           db=normalizeDB(raw);
           persistLocal();
           try{render();}catch(e){console.error("Erreur d'affichage",e);}
         }
       }else{
         db=normalizeDB(db);
         persistLocal();
         await sharedDoc.set({...db,initialized:true},{merge:true});
         try{render();}catch(e){}
       }
     }catch(e){ console.error("Synchronisation Firestore impossible",e); }
   },(err)=>{ console.error("Firestore onSnapshot",err); });
 }catch(e){ console.error("Initialisation Firebase impossible",e); }
}

async function save(){
  db=normalizeDB(db);
  const data=JSON.stringify(db);
  try{
    localStorage.setItem(KEY,data);
    localStorage.setItem(BACKUP_KEY,data);
  }catch(e){ console.error("Sauvegarde locale impossible",e); }
  if(sharedDoc){
    try{
      await sharedDoc.set({...JSON.parse(data),initialized:true});
    }catch(e){
      console.error("Enregistrement Firestore impossible",e);
      alert("La vente est conservée sur cet appareil, mais la synchronisation en ligne a échoué. Vérifiez votre connexion et les règles Firestore.");
    }
  }
  try{render();}catch(e){console.error("Erreur d'affichage",e);}
}

function drawSalesChart(mode){const rows=db.sales||[],now=new Date();const map={};if(mode==='daily'){for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);map[d.toISOString().slice(0,10)]=0}rows.forEach(x=>{if(map[x.date]!==undefined)map[x.date]+=Number(x.quantity||0)})}else if(mode==='monthly'){for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=d.toISOString().slice(0,7);map[k]=0}rows.forEach(x=>{const k=String(x.date||'').slice(0,7);if(map[k]!==undefined)map[k]+=Number(x.quantity||0)})}else{for(let y=now.getFullYear()-4;y<=now.getFullYear();y++)map[String(y)]=0;rows.forEach(x=>{const k=String(x.date||'').slice(0,4);if(map[k]!==undefined)map[k]+=Number(x.quantity||0)})}const labels=Object.keys(map),vals=Object.values(map),canvas=document.getElementById('salesChart');if(!canvas)return;const w=canvas.clientWidth||800,h=340,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);const pad={l:45,r:20,t:25,b:55},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(1,...vals),stepX=labels.length>1?cw/(labels.length-1):cw;c.strokeStyle='#d8deea';c.fillStyle='#6b7280';c.font='11px Arial';for(let i=0;i<=5;i++){const y=pad.t+ch-i*ch/5;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(Math.round(max*i/5),5,y+4)}c.strokeStyle='#1769e0';c.lineWidth=3;c.beginPath();vals.forEach((v,i)=>{const x=pad.l+i*stepX,y=pad.t+ch-(v/max)*ch;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle='#1769e0';vals.forEach((v,i)=>{const x=pad.l+i*stepX,y=pad.t+ch-(v/max)*ch;c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill()});c.fillStyle='#172033';c.font='10px Arial';labels.forEach((lab,i)=>{if(labels.length>18&&i%3!==0)return;const x=pad.l+i*stepX;c.save();c.translate(x,h-8);c.rotate(-Math.PI/5);c.fillText(lab,0,0);c.restore()});const total=vals.reduce((a,b)=>a+b,0);const peak=Math.max(...vals,0);document.getElementById('statMetrics').innerHTML=`${metric('Total période',total+' SIM',mode==='daily'?'30 derniers jours':mode==='monthly'?'12 derniers mois':'5 dernières années')}${metric('Moyenne',Math.round(total/(vals.length||1))+' SIM','Par période')}${metric('Pic',peak+' SIM','Meilleure période')}${metric('Ventes enregistrées',rows.length,'Transactions')}`}

 };

async function deleteChat(){
 try{
  if(!firestore)throw new Error('Firestore indisponible.');
  const user=firebase.auth&&firebase.auth().currentUser;
  if(!user)throw new Error('Connectez votre compte Firebase avant de supprimer.');
  if(!confirm('Supprimer uniquement vos messages de la conversation publique ?'))return;
  const snap=await firestore.collection('lsd_chat').where('uid','==',user.uid).get();
  const docs=snap.docs.filter(d=>{const x=d.data()||{};return !x.chatKey||x.chatKey==='public';});
  if(!docs.length){alert('Aucun de vos messages publics à supprimer.');return;}
  for(let i=0;i<docs.length;i+=450){const batch=firestore.batch();docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));await batch.commit();}
  alert(docs.length+' message(s) supprimé(s).');
 }catch(e){console.error('Suppression chat:',e);alert('Suppression impossible : '+(e.message||'Vérifiez les règles Firestore.'));}
}
async function clearChat(){
 try{
  if(!firestore)throw new Error('Firestore indisponible.');
  const user=firebase.auth&&firebase.auth().currentUser;
  if(!user)throw new Error('Connectez votre compte Firebase avant de nettoyer.');
  if(!confirm('Nettoyer tous les messages de la conversation publique pour tous les utilisateurs ?'))return;
  const snap=await firestore.collection('lsd_chat').get();
  const docs=snap.docs.filter(d=>{const x=d.data()||{};return !x.chatKey||x.chatKey==='public';});
  if(!docs.length){alert('La conversation publique est déjà vide.');return;}
  for(let i=0;i<docs.length;i+=450){const batch=firestore.batch();docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));await batch.commit();}
  alert(docs.length+' message(s) nettoyé(s).');
 }catch(e){console.error('Nettoyage chat:',e);alert('Nettoyage impossible : '+(e.message||'Vérifiez les règles Firestore et les permissions de suppression.'));}
}

async function ensureFirebaseAuthLoaded(){
  // Vérifie que les modules Firebase Compat sont réellement disponibles.
  if(!window.firebase){
    throw new Error('Firebase App n’est pas chargé. Vérifiez Internet ou les scripts Firebase.');
  }
  if(typeof firebase.initializeApp!=='function'){
    throw new Error('Le module Firebase App est incomplet.');
  }
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  if(typeof firebase.auth==='function') return true;
  // Tentative de chargement de Firebase Auth Compat si le script n’a pas été chargé.
  await new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-firebase-auth-fallback]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(new Error('Impossible de charger Firebase Auth.')),{once:true});return;}
    const script=document.createElement('script');
    script.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js';
    script.async=false;script.dataset.firebaseAuthFallback='1';
    script.onload=resolve;script.onerror=()=>reject(new Error('Impossible de charger Firebase Auth. Vérifiez Internet ou bloqueur de contenu.'));
    document.head.appendChild(script);
  });
  if(typeof firebase.auth!=='function') throw new Error('Le module de compte Firebase n’est pas disponible.');
  return true;
}

function setupPeer(video){peer=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});peer.ontrack=e=>{const stream=e.streams&&e.streams[0]?e.streams[0]:new MediaStream([e.track]);const rv=document.getElementById('remoteCallVideo');if(rv){rv.srcObject=stream;rv.muted=false;rv.volume=1;rv.style.display=video?'block':'none';rv.play().catch(()=>setCallStatus('📞 Appel en cours… Appuyez sur la vidéo pour activer le son.'));}let audio=document.getElementById('remoteCallAudio');if(!audio){audio=document.createElement('audio');audio.id='remoteCallAudio';audio.autoplay=true;audio.playsInline=true;document.body.appendChild(audio);}audio.srcObject=stream;audio.muted=false;audio.volume=1;audio.play().catch(()=>{});};peer.onconnectionstatechange=()=>{if(peer&&peer.connectionState==='connected'){stopCallRing();setCallStatus('📞 Appel connecté');}if(peer&&['failed','disconnected'].includes(peer.connectionState))setCallStatus('⚠️ Connexion audio/vidéo interrompue.');};return peer;}

let scanTarget=null;
let scanStream=null;
let scanRAF=null;
let liveDetector=null;
let scanBusy=false;
let zxingLoaded=false;

function openNativeScanner(target){
  scanTarget=target;
  const box=document.getElementById('scannerBox');
  const status=document.getElementById('scanStatus');
  if(box)box.style.display='block';
  if(status)status.textContent='📷 Démarrage du scan automatique…';
  startLiveScanner(target);

async function loadZXing(){
  if(window.ZXingBrowser || window.ZXing) return true;
  if(zxingLoading) return zxingLoading;
  zxingLoading=new Promise(resolve=>{
    const sc=document.createElement('script');
    sc.src='https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js';
    sc.onload=()=>{zxingLoaded=!!(window.ZXingBrowser||window.ZXing);resolve(zxingLoaded);};
    sc.onerror=()=>resolve(false);
    document.head.appendChild(sc);
  });
  return zxingLoading;
}

async function startLiveScanner(target){
  scanTarget=target;
  const status=document.getElementById('scanStatus');
  const wrap=document.getElementById('liveScanWrap');
  const video=document.getElementById('liveScanVideo');
  if(!video){return;}
  if(location.protocol!=='https:' && location.hostname!=='localhost' && location.protocol!=='file:'){
    if(status)status.textContent='⚠️ Le scan automatique nécessite HTTPS. Utilisez GitHub Pages (https://).';
    document.getElementById('scanPhotoBtn').style.display='inline-block';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(status)status.textContent='⚠️ Caméra en direct indisponible. Utilisez « Prendre une photo ».';
    document.getElementById('scanPhotoBtn').style.display='inline-block';
    return;
  }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=scanStream;
    await video.play();
    wrap.style.display='flex';
    if(status)status.textContent='🔍 Scanning… placez le code-barres dans le cadre. Détection automatique.';

    if('BarcodeDetector' in window){
      try{
        liveDetector=new BarcodeDetector({formats:['code_128','code_39','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix']});
      }catch(e){liveDetector=null;}
    }
    const zxingOk=await loadZXing();
    if(!liveDetector && !zxingOk){
      if(status)status.textContent='⚠️ Aucun lecteur de code-barres compatible dans ce navigateur. Utilisez « Prendre une photo ».';
      document.getElementById('scanPhotoBtn').style.display='inline-block';
      return;
    }
    scanLoop();
  }catch(e){
    if(status)status.textContent='⚠️ Accès caméra refusé ou indisponible. Autorisez la caméra puis réessayez.';
    document.getElementById('scanPhotoBtn').style.display='inline-block';
  }
}

async function scanLoop(){
  if(!scanStream || scanBusy)return;
  const video=document.getElementById('liveScanVideo');
  try{
    scanBusy=true;
    let val='';
    if(liveDetector){
      const codes=await liveDetector.detect(video);
      if(codes && codes.length) val=(codes[0].rawValue||'');
    }
    if(!val && (window.ZXingBrowser||window.ZXing)){
      // ZXing fallback is activated through the next animation frame if native detector found nothing.
      // Native BarcodeDetector is preferred because it is faster on Android Chrome.
    }
    if(val){
      const digits=val.replace(/\D/g,'');
      if(digits.length>=10){setScannedValue(digits);return;}
    }
  }catch(e){}
  finally{scanBusy=false;}
  scanRAF=requestAnimationFrame(scanLoop);
}

function setScannedValue(val){
  const input=document.getElementById(scanTarget); if(!input)return;
  input.value=String(val).replace(/\D/g,'');
  input.dispatchEvent(new Event('input',{bubbles:true}));
  updateSaleQty();
  const status=document.getElementById('scanStatus'); if(status)status.textContent='✅ Série détectée automatiquement : '+input.value;
  setTimeout(()=>stopScanner(),700);
}

async function scanPhoto(fileInput){
  const file=fileInput && fileInput.files && fileInput.files[0];
  if(!file)return;
  const status=document.getElementById('scanStatus');
  if(status)status.textContent='🔍 Analyse automatique du code-barres…';
  try{
    if('BarcodeDetector' in window){
      const detector=new BarcodeDetector({formats:['code_128','code_39','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix']});
      const bmp=await createImageBitmap(file);
      const codes=await detector.detect(bmp);
      if(codes && codes.length){
        const v=(codes[0].rawValue||'').replace(/\D/g,'');
        if(v.length>=10){setScannedValue(v);return;}
      }
    }
  }catch(e){}
  if(status)status.textContent='❌ Code non détecté. Reprenez la photo de plus près, bien nette et sans reflet.';
}

function stopScanner(hide=true){
  if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;scanBusy=false;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  const v=document.getElementById('liveScanVideo');if(v){v.pause();v.srcObject=null;}
  const w=document.getElementById('liveScanWrap');if(w)w.style.display='none';
  const b=document.getElementById('scannerBox');if(hide&&b)b.style.display='none';
}

function usdPage(){
 const capital=+db.usdCapital||0, tx=db.usdTransactions||[];
 const deposits=tx.filter(x=>x.type==='Dépôt').reduce((a,x)=>a+x.amount,0), withdrawals=tx.filter(x=>x.type==='Retrait').reduce((a,x)=>a+x.amount,0), sales=tx.filter(x=>x.type==='Vente USD').reduce((a,x)=>a+x.amount,0);
 const balance=capital+deposits-withdrawals-sales;
 document.getElementById("app").innerHTML=`<div class="grid">${metric("Capital USD",usd(capital),"Capital de départ")}${metric("Dépôts",usd(deposits),"Dépôts enregistrés")}${metric("Retraits",usd(withdrawals),"Retraits enregistrés")}${metric("Solde USD",usd(balance),"Capital + dépôts − retraits − ventes")}</div>
 <div class="card section"><h2>Compte USD</h2><div class="formgrid"><label>Capital (USD)<input id="uc" type="number" step="0.01" value="${capital}"></label><label>Dépôt (USD)<input id="ud" type="number" step="0.01" value="${deposit}"></label><label>Taux FC / USD<input id="rate" type="number" value="${db.currencyRate}"></label></div><br><button class="btn" style="background:var(--primary);color:#fff" onclick="db.usdCapital=+uc.value;db.usdDeposit=+ud.value;db.currencyRate=+rate.value;save()">Enregistrer</button><p class="small">Équivalent du solde USD : ${money(balance*Number(db.currencyRate||0))}</p></div><div class="card section"><h2>Historique USD</h2>${usdTransactionsTable()}</div>`;
}
function usdTx(type,title){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=`<div class="formgrid"><label>Date<input id="udate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Montant USD<input id="uamount" type="number" min="0" step="0.01"></label><label>Taux FC/USD<input id="urate" type="number" value="${db.currencyRate||2400}"></label><label class="wide">Commentaire<textarea id="unote" rows="2"></textarea></label></div><br><button class="btn" style="background:var(--primary);color:#fff" onclick="saveUsdTx('${type}')">Enregistrer</button>`;
 document.getElementById("modal").classList.add("open");
}
function saveUsdTx(type){const amount=+uamount.value||0;if(amount<=0)return alert("Saisissez un montant USD valide.");db.usdTransactions.push({id:Date.now(),date:udate.value,type,amount,rate:+urate.value||db.currencyRate,note:unote.value.trim()});closeModal();save();}
function usdTransactionsTable(){const rows=db.usdTransactions||[];return rows.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th class="num">USD</th><th class="num">FC</th><th>Commentaire</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td><span class="tag">${esc(x.type)}</span></td><td class="num">${usd(x.amount)}</td><td class="num">${money(x.amount*x.rate)}</td><td>${esc(x.note)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Aucune opération USD.</div>`}
function usdDepositPage(){document.getElementById("app").innerHTML=`<div class="card"><div class="toolbar"><div><h2>➕ Dépôt USD</h2><div class="small">Enregistrer les dépôts en dollars.</div></div><button class="btn" style="background:var(--primary);color:#fff" onclick="usdTx('Dépôt','Nouveau dépôt USD')">+ Dépôt</button></div>${usdTransactionsTable()}</div>`;}
function usdWithdrawPage(){document.getElementById("app").innerHTML=`<div class="card"><div class="toolbar"><div><h2>➖ Retrait USD</h2><div class="small">Enregistrer les retraits en dollars.</div></div><button class="btn" style="background:var(--primary);color:#fff" onclick="usdTx('Retrait','Nouveau retrait USD')">+ Retrait</button></div>${usdTransactionsTable()}</div>`;}
function usdSalePage(){document.getElementById("app").innerHTML=`<div class="card"><div class="toolbar"><div><h2>💱 Vente USD</h2><div class="small">Enregistrer les ventes de dollars et leur taux.</div></div><button class="btn" style="background:var(--primary);color:#fff" onclick="usdTx('Vente USD','Nouvelle vente USD')">+ Vente USD</button></div>${usdTransactionsTable()}</div>`;}
function settingsPage(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>Paramètres</h2><div class="formgrid"><label>Nom de l'activité<input id="biz" value="${esc(db.business)}"></label><label>Taux FC / USD<input id="sr" type="number" value="${db.currencyRate}"></label><label>Capital FC<input id="cap" type="number" value="${db.capital}"></label><label>Marchand 1<input id="m1" value="${esc(db.merchant1)}"></label><label>Montant marchand 1<input id="m1a" type="number" value="${db.merchant1Amount}"></label><label>Marchand 2<input id="m2" value="${esc(db.merchant2)}"></label></div><br><button class="btn" style="background:var(--primary);color:#fff" onclick="db.business=biz.value;db.currencyRate=+sr.value;db.capital=+cap.value;db.merchant1=m1.value;db.merchant1Amount=+m1a.value;db.merchant2=m2.value;save()">Enregistrer</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="btn" onclick="if(confirm('Réinitialiser les données ?')){db=normalizeDB(INITIAL);save()}">Réinitialiser la base initiale</button></div>`;
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}); const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gestion-lsd-sauvegarde.json";a.click();URL.revokeObjectURL(a.href);
}
function exportCSV(){
 const rows=[["DATE","TYPE","DESCRIPTION","QUANTITE_SIM"]];
 (db.operations||[]).forEach(o=>rows.push([o.date,o.type,o.note,o.amount]));
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Gestion_LSD_operations.csv";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert("Sauvegarde restaurée.");}catch{alert("Fichier invalide.");}};r.readAsText(f);}

const AUTH_USER="LSD MESCHAC", AUTH_PASS="Intelligente225@";
const HIST_DB="GestionLSD_Historique", HIST_STORE="jours";
let histDB=null;
function openHistDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(HIST_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(HIST_STORE))r.result.createObjectStore(HIST_STORE,{keyPath:"date"})};r.onsuccess=()=>{histDB=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function snapshot(){if(!histDB)return;const date=new Date().toISOString().slice(0,10);const d=total(db.debts),l=total(db.deliveries),sr=Number(db.pending||0)-l;const salesQty=(db.sales||[]).filter(x=>x.date===date).reduce((a,x)=>a+Number(x.quantity||0),0);const rec={date,stockIn:Number(db.stockIn||0),pending:Number(db.pending||0),simLivrer:l,stockRestant:sr,dettes:d,ventesLSD:salesQty,capital:Number(db.capital||0),valeurStockIn:Number(db.stockIn||0)*Number(db.unitPrice||0),valeurDette:d*Number(db.unitPrice||0),marchand1:Number(db.merchant1Amount||0),difference:Number(db.capital||0)-(sr*Number(db.unitPrice||0)+d*Number(db.unitPrice||0)+Number(db.merchant1Amount||0))};histDB.transaction(HIST_STORE,"readwrite").objectStore(HIST_STORE).put(rec)}
function allHistory(){return new Promise((resolve,reject)=>{const r=histDB.transaction(HIST_STORE).objectStore(HIST_STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
const oldSave=save; save=async function(){await oldSave();snapshot()};
function doLogin(){if(loginUser.value.trim()===AUTH_USER&&loginPass.value===AUTH_PASS){sessionStorage.setItem("lsd_auth","1");loginScreen.style.display="none";mainApp.style.display="block";render()}else loginError.textContent="Nom d’utilisateur ou mot de passe incorrect."}
function doLogout(){sessionStorage.removeItem("lsd_auth");location.reload()}
function historyPage(){allHistory().then(rows=>{rows.sort((a,b)=>a.date.localeCompare(b.date));app.innerHTML=`<div class="card"><div class="toolbar"><div><h2>Base de données — Historique quotidien</h2><div class="small">Une ligne est conservée pour chaque jour mis à jour.</div></div><button class="btn" style="background:var(--primary);color:#fff" onclick="exportPeriod()">📊 Extraire Excel</button></div><div class="formgrid"><label>Du<input id="fromDate" type="date"></label><label>Au<input id="toDate" type="date"></label></div><div class="tablewrap" style="margin-top:12px">${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Ventes LSD</th><th>Stock IN</th><th>Pending</th><th>SIM à livrer</th><th>Stock restant</th><th>Dette</th><th>Différence</th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.ventesLSD||0} SIM</td><td>${r.stockIn} SIM</td><td>${r.pending} SIM</td><td>${r.simLivrer} SIM</td><td>${r.stockRestant} SIM</td><td>${r.dettes} SIM</td><td>${money(r.difference)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Aucun historique enregistré.</div>`}</div></div>`})}
async function exportPeriod(){const rows=(await allHistory()).sort((a,b)=>a.date.localeCompare(b.date));const from=fromDate.value,to=toDate.value;const f=rows.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));if(!f.length)return alert("Aucune donnée dans cette période.");let t='<table border="1"><tr><th>Date</th><th>Ventes LSD (SIM)</th><th>Stock IN (SIM)</th><th>Pending (SIM)</th><th>SIM à livrer</th><th>Stock restant (SIM)</th><th>Dette (SIM)</th><th>Capital déclaré (FC)</th><th>Valeur Stock IN (FC)</th><th>Valeur dette (FC)</th><th>Valeur marchand 1 (FC)</th><th>Différence (FC)</th></tr>';f.forEach(r=>t+=`<tr><td>${r.date}</td><td>${r.ventesLSD||0}</td><td>${r.stockIn}</td><td>${r.pending}</td><td>${r.simLivrer}</td><td>${r.stockRestant}</td><td>${r.dettes}</td><td>${r.capital}</td><td>${r.valeurStockIn}</td><td>${r.valeurDette}</td><td>${r.marchand1}</td><td>${r.difference}</td></tr>`);t+='</table>';const blob=new Blob([`<html><meta charset="utf-8"><body><h2>Gestion LSD — ${from||f[0].date} au ${to||f.at(-1).date}</h2>${t}</body></html>`],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Gestion_LSD_${from||f[0].date}_${to||f.at(-1).date}.xls`;a.click();URL.revokeObjectURL(a.href)}
async function initAuth(){await openHistDB();if(sessionStorage.getItem("lsd_auth")==="1"){loginScreen.style.display="none";mainApp.style.display="block";render()}else{mainApp.style.display="none"}}
firebaseReady=initFirebase().catch(e=>{console.error("Initialisation Firebase:",e);return null;});
initAuth();
</script>
