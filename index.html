function normalizeDB(source){
  const base=JSON.parse(JSON.stringify(INITIAL));
  const input=(source&&typeof source==="object")?source:{};
  const merged={...base,...input};
  if(!Array.isArray(merged.sales)) merged.sales=[];
  if(!Array.isArray(merged.debts)) merged.debts=[];
  if(!Array.isArray(merged.deliveries)) merged.deliveries=[];
  if(!Array.isArray(merged.operations)) merged.operations=[];
  if(!Array.isArray(merged.usdTransactions)) merged.usdTransactions=[];
  if(!Array.isArray(merged.creditTransactions)) merged.creditTransactions=[];
  if(!Number.isFinite(Number(merged.usdBuyRate))) merged.usdBuyRate=2330;
  if(!Number.isFinite(Number(merged.usdSellRate))) merged.usdSellRate=2400;
  if(!Number.isFinite(Number(merged.creditRate))) merged.creditRate=2350;
  if(!Number.isFinite(Number(merged.creditMultiplier))) merged.creditMultiplier=23.5;
  if(!Number.isFinite(Number(merged.creditBase))) merged.creditBase=10550;
  return merged;
}

function persistLocal(){

async function initFirebase(){
 if(!window.firebase){console.warn('Firebase App non chargé.');return null;}
 try{
   if(typeof firebase.initializeApp!=='function') throw new Error('Firebase App Compat non chargé.');
   if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
   // L’utilisateur de l’application est déjà connecté avec le login local.
   // Pour que Firestore reconnaisse aussi cette session, on ouvre automatiquement
   // une session Firebase anonyme (à activer dans Firebase > Authentication > Méthode de connexion).
   if(firebase.auth){
     await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
     firebaseAuthReady=(async()=>{
       if(firebase.auth().currentUser)return firebase.auth().currentUser;
       try{return (await firebase.auth().signInAnonymously()).user;}
       catch(e){console.warn('Connexion Firebase anonyme impossible:',e);return null;}
     })();
     await firebaseAuthReady;
   }
   firestore=firebase.firestore();
   sharedDoc=firestore.collection("megers").doc("database");
   firebaseUnsubscribe=sharedDoc.onSnapshot(async (snap)=>{
     try{
       if(snap.exists){
         const raw=snap.data()||{};
         const keys=Object.keys(raw).filter(k=>k!=="initialized");
         // Si le document ne contient encore que le marqueur Firebase,
         // on conserve les données locales existantes et on les initialise dans le cloud.
         if(keys.length===0){
           db=normalizeDB(db);
           persistLocal();
           await sharedDoc.set({...db,initialized:true},{merge:true});
         }else{
           db=normalizeDB(raw);
           persistLocal();
           try{render();}catch(e){console.error("Erreur d'affichage",e);}
         }
       }else{
         db=normalizeDB(db);
         persistLocal();
         await sharedDoc.set({...db,initialized:true},{merge:true});
         try{render();}catch(e){}
       }
     }catch(e){ console.error("Synchronisation Firestore impossible",e); }
   },(err)=>{ console.error("Firestore onSnapshot",err); });
 }catch(e){ console.error("Initialisation Firebase impossible",e); }
}

function salesPage(){
 const rows=db.sales||[];
 const q=(window.saleSearch||'').toLowerCase();
 const sort=window.saleSort||'recent';
 let list=rows.map((x,idx)=>({x,idx})).filter(({x})=>{
   const hay=[x.date,x.nomSV,x.numeroSV,x.first,x.last,x.quantity,x.statut,x.lsd,x.reference,x.commentaire].join(' ').toLowerCase();
   return !q||hay.includes(q);
 });
 list.sort((a,b)=>{
   const A=a.x,B=b.x;
   if(sort==='dateOld') return String(A.date).localeCompare(String(B.date));
   if(sort==='dateNew') return String(B.date).localeCompare(String(A.date));
   if(sort==='name') return String(A.nomSV).localeCompare(String(B.nomSV),'fr');
   if(sort==='qty') return Number(B.quantity||0)-Number(A.quantity||0);
   return b.idx-a.idx;
 });
 document.getElementById("app").innerHTML=`
 <div class="card"><div class="toolbar"><div><h2>🛒 Vente LSD</h2><div class="small">Enregistrez et gérez chaque vente de SIM avec sa série ICCID.</div></div><button class="btn" style="background:var(--primary);color:#fff" onclick="openSale()">+ Nouvelle vente</button></div>
 <div class="toolbar" style="justify-content:flex-start;margin:10px 0 14px;gap:8px">
   <input class="search" style="flex:1;min-width:190px" placeholder="🔎 Rechercher une vente…" value="${esc(window.saleSearch||'')}" oninput="window.saleSearch=this.value"> <button class="btn" style="background:#eef4ff;color:#1458b0;border:1px solid #cdddf8" onclick="render()">🔎 Rechercher</button>
   <select class="search" onchange="window.saleSort=this.value;render()">
    <option value="recent" ${sort==='recent'?'selected':''}>Trier : plus récentes</option>
    <option value="dateOld" ${sort==='dateOld'?'selected':''}>Trier : plus anciennes</option>
    <option value="name" ${sort==='name'?'selected':''}>Trier : nom SV</option>
    <option value="qty" ${sort==='qty'?'selected':''}>Trier : quantité</option>
   </select>
   <button class="btn ghost" style="background:#eef4ff;color:#1458b0;border:1px solid #cdddf8" onclick="exportSalesExcel()">📊 Extraire Excel</button>
 </div>
 ${list.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>SV</th><th>N° SV</th><th>Série</th><th>Qté</th><th>Statut</th><th>LSD</th><th>Référence</th><th>Actions</th></tr></thead><tbody>${list.map(({x,idx})=>`<tr><td>${esc(x.date)}</td><td>${esc(x.nomSV)}</td><td>${esc(x.numeroSV)}</td><td>${esc(x.first)} → ${esc(x.last)}</td><td>${x.quantity} SIM</td><td>${esc(x.statut)}</td><td>${esc(x.lsd)}</td><td>${esc(x.reference)}</td><td style="white-space:nowrap"><button class="btn" onclick="invoiceSale(${idx})">🧾 Facture</button> <button class="btn" style="background:#fff3cd;color:#7a5600" onclick="editSale(${idx})">✏️ Modifier</button> <button class="btn" style="background:#ffe8e8;color:#b42318" onclick="deleteSale(${idx})">🗑 Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${rows.length?'Aucune vente ne correspond à votre recherche.':'Aucune vente enregistrée.'}</div>`}</div>`;
}
function getSalesFiltered(){
 const from=document.getElementById("sumFrom")?.value||window.sumFrom||"";
 const to=document.getElementById("sumTo")?.value||window.sumTo||"";
 // Le résumé reste vide tant que les deux bornes de la période ne sont pas sélectionnées.
 if(!from||!to)return [];
 return (db.sales||[]).filter(x=>x.date>=from&&x.date<=to);
}
function salesSummaryPage(){
 const from=window.sumFrom||'';
 const to=window.sumTo||'';
 const periodeComplete=!!(from&&to);
 const rows=periodeComplete?getSalesFiltered():[];
 const totalQty=rows.reduce((a,x)=>a+Number(x.quantity||0),0);
 const people={};
 rows.forEach(x=>{const key=(x.numeroSV||x.nomSV||'—');if(!people[key])people[key]={nom:x.nomSV||'—',qty:0};people[key].qty+=Number(x.quantity||0)});
 const byStatus={};
 rows.forEach(x=>{const k=x.statut||'Non défini';if(!byStatus[k])byStatus[k]={n:0,q:0};byStatus[k].n++;byStatus[k].q+=Number(x.quantity||0)});
 document.getElementById('app').innerHTML=`<div class="card summary-card">
 <div class="summary-title"><h1>RÉSUMÉ DE VENTE LSD</h1><div class="small">Synthèse professionnelle des ventes de SIM</div></div>
 <div class="summary-actions"><button class="btn" style="background:var(--primary);color:#fff" onclick="generateAndShareSalesPDF()" ${periodeComplete?'':'disabled'}>📄 Générer & partager le PDF</button></div>
 <div class="summaryfilters"><label>Du<input id="sumFrom" type="date" value="${esc(from)}" onchange="window.sumFrom=this.value;render()"></label><label>Au<input id="sumTo" type="date" value="${esc(to)}" onchange="window.sumTo=this.value;render()"></label><button class="btn" onclick="window.sumFrom='';window.sumTo='';render()">Réinitialiser</button></div>
 ${!periodeComplete?`<div class="empty" style="margin-top:18px;padding:28px;text-align:center"><strong>📅 Sélectionnez une période</strong><br><span class="small">Choisissez une date de début et une date de fin pour afficher le résumé.</span></div>`:`<><br>
 <div class="grid">${metric("Quantité totale vendue",totalQty+" SIM","Période sélectionnée")}${metric("SV acheteurs",Object.keys(people).length,"SV distincts")}${metric("Nouveaux",byStatus.Nouveau?.n||0,"SV au statut Nouveau")}${metric("Anciens",byStatus.Ancien?.n||0,"SV au statut Ancien")}</div>
 <div class="section card"><h2>SV acheteurs par statut</h2>${Object.keys(byStatus).length?`<table class="table"><thead><tr><th>Statut</th><th class="num">Nombre de SV</th><th class="num">Quantité achetée</th></tr></thead><tbody>${Object.entries(byStatus).map(([k,v])=>`<tr><td><span class="tag">${esc(k)}</span></td><td class="num"><strong>${v.n}</strong></td><td class="num"><strong>${v.q} SIM</strong></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Aucune vente sur cette période.</div>`}</div>
 <div class="section card"><h2>Nom et quantité des SV</h2>${Object.keys(people).length?`<div class="tablewrap"><table class="table"><thead><tr><th>Nom SV</th><th class="num">Quantité</th></tr></thead><tbody>${Object.values(people).sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(x=>`<tr><td>${esc(x.nom)}</td><td class="num"><strong>${x.qty} SIM</strong></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucun SV à afficher.</div>`}</div></>`}</div>`;
}
function salesSummaryData(){const from=window.sumFrom||document.getElementById('sumFrom')?.value||'';const to=window.sumTo||document.getElementById('sumTo')?.value||'';if(!from||!to)throw new Error('Sélectionnez une date de début et une date de fin avant de générer le PDF.');const rows=getSalesFiltered();const people={};rows.forEach(x=>{const k=x.numeroSV||x.nomSV||'—';if(!people[k])people[k]={nom:x.nomSV||'—',qty:0};people[k].qty+=Number(x.quantity||0)});return {rows,from,to,totalQty:rows.reduce((a,x)=>a+Number(x.quantity||0),0),people:Object.values(people).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'))};}

 function header(){doc.addImage(OFFICIAL_PDF_LOGO,'JPEG',0,0,W,39.1);doc.setFillColor(255,255,255);doc.setDrawColor(220,225,232);doc.roundedRect(14,41,W-28,13,2,2,'FD');doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('RÉSUMÉ DE VENTE LSD',19,49);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...gray);doc.text(period,W-19,49,{align:'right'});}

 header();
 let y=59;
 doc.setFillColor(...light);doc.roundedRect(14,y,W-28,29,3,3,'F');

 doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text(String(d.people.length),88,y+18);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...gray);doc.text('SV acheteurs',88,y+24);
 const status={};d.rows.forEach(x=>{const k=x.statut||'Non défini';if(!status[k])status[k]={n:0,q:0};status[k].n++;status[k].q+=Number(x.quantity||0)});
 doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text(String(status.Nouveau?.n||0),140,y+18);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...gray);doc.text('SV nouveaux',140,y+24); doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text(String(status.Ancien?.n||0),175,y+18);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...gray);doc.text('SV anciens',175,y+24);
 y=78; y=sectionTitle('RÉPARTITION PAR STATUT',y);
 doc.setFillColor(...light);doc.rect(14,y,W-28,8,'F');doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('Statut',18,y+5.2);doc.text('Nombre de SV',105,y+5.2,{align:'center'});doc.text('Quantité',180,y+5.2,{align:'center'});y+=8;
 Object.entries(status).forEach(([k,v])=>{if(y>270){doc.addPage();header();y=42;y=sectionTitle('RÉPARTITION PAR STATUT (suite)',y)}doc.setTextColor(...navy);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(k,18,y+5);doc.text(String(v.n),105,y+5,{align:'center'});doc.text(qty(v.q)+' SIM',180,y+5,{align:'center'});doc.setDrawColor(225,229,235);doc.line(14,y+8,W-14,y+8);y+=10;});

 d.people.forEach((x,idx)=>{if(y>270){doc.addPage();header();y=42;y=sectionTitle('NOM ET QUANTITÉ DES SV (suite)',y);doc.setFillColor(...light);doc.rect(14,y,W-28,8,'F');doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('Nom du SV',18,y+5.2);doc.text('Quantité achetée',180,y+5.2,{align:'center'});y+=8;}if(idx%2===0){doc.setFillColor(250,251,253);doc.rect(14,y,W-28,8,'F')}doc.setTextColor(...navy);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(String(x.nom).slice(0,65),18,y+5.2);doc.setFont('helvetica','bold');doc.text(qty(x.qty)+' SIM',180,y+5.2,{align:'center'});y+=8;});

async function generateAndShareSalesPDF(){try{const doc=buildSalesPDF(),d=salesSummaryData(),blob=doc.output('blob'),name=`Resume_Vente_LSD_${d.from||'debut'}_${d.to||'fin'}.pdf`,file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'Résumé de vente LSD',text:`Résumé de vente LSD — ${d.totalQty} SIM — ${d.people.length} SV`,files:[file]});}else{doc.save(name);alert('Le PDF a été généré. Le partage de fichier PDF n’est pas disponible sur cet appareil, il a donc été enregistré.');}}catch(e){if(e?.name!=='AbortError')alert(e.message||'Impossible de générer ou partager le PDF.');}}

function drawSalesChart(mode){const rows=db.sales||[],now=new Date();const map={};if(mode==='daily'){for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);map[d.toISOString().slice(0,10)]=0}rows.forEach(x=>{if(map[x.date]!==undefined)map[x.date]+=Number(x.quantity||0)})}else if(mode==='monthly'){for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=d.toISOString().slice(0,7);map[k]=0}rows.forEach(x=>{const k=String(x.date||'').slice(0,7);if(map[k]!==undefined)map[k]+=Number(x.quantity||0)})}else{for(let y=now.getFullYear()-4;y<=now.getFullYear();y++)map[String(y)]=0;rows.forEach(x=>{const k=String(x.date||'').slice(0,4);if(map[k]!==undefined)map[k]+=Number(x.quantity||0)})}const labels=Object.keys(map),vals=Object.values(map),canvas=document.getElementById('salesChart');if(!canvas)return;const w=canvas.clientWidth||800,h=340,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);const pad={l:45,r:20,t:25,b:55},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(1,...vals),stepX=labels.length>1?cw/(labels.length-1):cw;c.strokeStyle='#d8deea';c.fillStyle='#6b7280';c.font='11px Arial';for(let i=0;i<=5;i++){const y=pad.t+ch-i*ch/5;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(Math.round(max*i/5),5,y+4)}c.strokeStyle='#1769e0';c.lineWidth=3;c.beginPath();vals.forEach((v,i)=>{const x=pad.l+i*stepX,y=pad.t+ch-(v/max)*ch;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle='#1769e0';vals.forEach((v,i)=>{const x=pad.l+i*stepX,y=pad.t+ch-(v/max)*ch;c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill()});c.fillStyle='#172033';c.font='10px Arial';labels.forEach((lab,i)=>{if(labels.length>18&&i%3!==0)return;const x=pad.l+i*stepX;c.save();c.translate(x,h-8);c.rotate(-Math.PI/5);c.fillText(lab,0,0);c.restore()});const total=vals.reduce((a,b)=>a+b,0);const peak=Math.max(...vals,0);document.getElementById('statMetrics').innerHTML=`${metric('Total période',total+' SIM',mode==='daily'?'30 derniers jours':mode==='monthly'?'12 derniers mois':'5 dernières années')}${metric('Moyenne',Math.round(total/(vals.length||1))+' SIM','Par période')}${metric('Pic',peak+' SIM','Meilleure période')}${metric('Ventes enregistrées',rows.length,'Transactions')}`}

async function ensureFirebaseAuthLoaded(){
  // Vérifie que les modules Firebase Compat sont réellement disponibles.
  if(!window.firebase){
    throw new Error('Firebase App n’est pas chargé. Vérifiez Internet ou les scripts Firebase.');
  }
  if(typeof firebase.initializeApp!=='function'){
    throw new Error('Le module Firebase App est incomplet.');
  }
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  if(typeof firebase.auth==='function') return true;
  // Tentative de chargement de Firebase Auth Compat si le script n’a pas été chargé.
  await new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-firebase-auth-fallback]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(new Error('Impossible de charger Firebase Auth.')),{once:true});return;}
    const script=document.createElement('script');
    script.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js';
    script.async=false;script.dataset.firebaseAuthFallback='1';
    script.onload=resolve;script.onerror=()=>reject(new Error('Impossible de charger Firebase Auth. Vérifiez Internet ou bloqueur de contenu.'));
    document.head.appendChild(script);
  });
  if(typeof firebase.auth!=='function') throw new Error('Le module de compte Firebase n’est pas disponible.');
  return true;
}

function ensureRemoteAudio(){

  audio=document.createElement('audio');

  audio.controls=true;
  audio.playsInline=true;

  if(panel)panel.appendChild(audio);else document.body.appendChild(audio);
 }

}

async function addRemoteIceCandidateSafe(candidate){
 if(!peer||!candidate)return;
 if(!peer.remoteDescription||!peer.remoteDescription.type){pendingRemoteIceCandidates.push(candidate);return;}
 try{await peer.addIceCandidate(new RTCIceCandidate(candidate));}catch(e){console.warn('ICE distant:',e);}
}
async function flushRemoteIceCandidates(){
 const list=pendingRemoteIceCandidates.splice(0);
 for(const c of list)await addRemoteIceCandidateSafe(c);
}
function setupPeer(video){
 peer=new RTCPeerConnection({iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'}
 ]});
 const remoteStream=new MediaStream();
 const remoteAudioStream=new MediaStream();
 pendingRemoteIceCandidates=[];
 peer.ontrack=async e=>{
  if(!e.track)return;
  const target=e.track.kind==='audio'?remoteAudioStream:remoteStream;
  if(!target.getTracks().some(t=>t.id===e.track.id))target.addTrack(e.track);
  if(e.track.kind==='video'){
   const rv=document.getElementById('remoteCallVideo');
   if(rv){rv.srcObject=remoteStream;rv.muted=true;rv.volume=0;rv.autoplay=true;rv.playsInline=true;rv.style.display=video?'block':'none';rv.play().catch(()=>{});}
  }
  if(e.track.kind==='audio'){
   const audio=ensureRemoteAudio();
   // Utiliser le flux fourni par WebRTC quand il est disponible.
   // Cela évite de perdre la piste audio distante sur certains téléphones.
   const incomingStream=(e.streams&&e.streams[0])?e.streams[0]:remoteAudioStream;
   if(!incomingStream.getAudioTracks().some(t=>t.id===e.track.id)){
    try{incomingStream.addTrack(e.track)}catch(err){console.warn('Ajout piste audio:',err)}
   }
   audio.srcObject=incomingStream;
   audio.muted=false;
   audio.volume=1;
   audio.autoplay=true;
   audio.playsInline=true;
   audio.setAttribute('autoplay','');
   audio.setAttribute('playsinline','');
   audio.style.display='block';
   try{
    await audio.play();
    setCallStatus('📞 Son reçu — votre microphone est transmis.');
   }catch(err){
    setCallStatus('📞 Appel connecté — appuyez sur « Activer le son ».');
   }
  }
 };
 peer.onconnectionstatechange=()=>{
  if(!peer)return;
  if(peer.connectionState==='connected'){stopCallRing();setCallStatus('📞 Appel connecté — son bidirectionnel actif.');}
  if(['failed','disconnected'].includes(peer.connectionState))setCallStatus('⚠️ Connexion audio/vidéo interrompue. Relancez l’appel.');
 };
 peer.oniceconnectionstatechange=()=>{
  if(peer&&peer.iceConnectionState==='failed')setCallStatus('⚠️ Réseau bloqué. Essayez un autre réseau puis relancez.');
 };
 return peer;
}

async function startCall(video){
 try{
  const user=firebase.auth&&firebase.auth().currentUser;
  if(!user)return alert('Connectez votre compte avant de lancer un appel.');
  if(!privateChatUser||!privateChatUser.uid)return alert('Sélectionnez d’abord un participant pour appeler en privé.');
  if(!firestore)return alert('Firebase Firestore indisponible.');
  if(callDocId)await endCall();
  localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!video});
  const lv=document.getElementById('localCallVideo');if(lv){lv.srcObject=localStream;lv.style.display=video?'block':'none';}
  const ref=firestore.collection('lsd_calls').doc();callDocId=ref.id;
  setupPeer(!!video);
  // Installer ICE avant toute création de SDP afin de ne perdre aucun candidat.
  peer.onicecandidate=e=>{if(e.candidate)ref.collection('callerCandidates').add(e.candidate.toJSON()).catch(console.warn)};
  localStream.getTracks().forEach(t=>{t.enabled=true;peer.addTrack(t,localStream);});
  const call={callerUid:user.uid,callerName:chatUserName(user),calleeUid:privateChatUser.uid,calleeName:privateChatUser.name||'',video:!!video,status:'ringing',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  await ref.set(call);
  const offer=await peer.createOffer();await peer.setLocalDescription(offer);await ref.update({offer:{type:offer.type,sdp:offer.sdp}});
  const unsub=ref.onSnapshot(async snap=>{const d=snap.data()||{};if(d.answer&&!peer.currentRemoteDescription){await peer.setRemoteDescription(new RTCSessionDescription(d.answer)).then(flushRemoteIceCandidates).catch(console.warn);setCallStatus('📞 Appel connecté');stopCallRing();}if(d.status==='ended')endCall(true);});callCandidateUnsubs.push(unsub);
  ref.collection('calleeCandidates').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added')addRemoteIceCandidateSafe(c.doc.data())}));
  setCallStatus('📞 Appel en cours…');updateCallPanel();ringCall();
 }catch(e){console.error(e);clearCallMedia();callDocId=null;updateCallPanel();alert('Appel impossible : '+(e.message||e));}
}
async function watchIncomingCalls(user){
 if(!firestore)return; if(callUnsub)callUnsub();
 callUnsub=firestore.collection('lsd_calls').where('calleeUid','==',user.uid).where('status','==','ringing').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added'){const d=c.doc.data();incomingCall={id:c.doc.id,data:d};ringCall();if(confirm('📞 Appel entrant de '+(d.callerName||'')+'\nAccepter ?'))answerCall(c.doc.id,d);else rejectCall(c.doc.id);}}));
}
async function answerCall(id,d){
 try{
  stopCallRing();
  const user=firebase.auth&&firebase.auth().currentUser;
  if(!user)throw new Error('Connectez-vous avant de répondre à l’appel.');
  const ref=firestore.collection('lsd_calls').doc(id);
  callDocId=id;

  // L'offre SDP peut arriver quelques millisecondes après la notification entrante.
  // On relit donc le document et on attend brièvement une offre valide avant de répondre.
  let callData=d||{};
  for(let attempt=0;attempt<8;attempt++){
   const snap=await ref.get();
   if(snap.exists)callData={...(snap.data()||{}),...(callData||{})};
   if(callData.offer&&typeof callData.offer.type==='string'&&typeof callData.offer.sdp==='string'&&callData.offer.sdp.trim())break;
   await new Promise(resolve=>setTimeout(resolve,400));
  }
  if(!callData.offer||!['offer'].includes(callData.offer.type)||typeof callData.offer.sdp!=='string'||!callData.offer.sdp.trim()){
   throw new Error('L’offre d’appel est absente ou invalide. Demandez à l’appelant de relancer l’appel.');
  }

  privateChatUser={uid:callData.callerUid,name:callData.callerName||'',email:''};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!callData.video});
  const lv=document.getElementById('localCallVideo');
  if(lv){lv.srcObject=localStream;lv.style.display=callData.video?'block':'none';}
  setupPeer(!!callData.video);
  localStream.getTracks().forEach(t=>{t.enabled=true;peer.addTrack(t,localStream);});
  peer.onicecandidate=e=>{if(e.candidate)ref.collection('calleeCandidates').add(e.candidate.toJSON()).catch(console.warn)};
  await peer.setRemoteDescription({type:'offer',sdp:callData.offer.sdp});
  await flushRemoteIceCandidates();
  const answer=await peer.createAnswer();
  await peer.setLocalDescription(answer);
  await ref.update({answer:{type:answer.type,sdp:answer.sdp},status:'accepted'});
  ref.collection('callerCandidates').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added')addRemoteIceCandidateSafe(c.doc.data())}));
  ref.onSnapshot(s=>{if(s.data()?.status==='ended')endCall(true)});
  setCallStatus('📞 Appel connecté');updateCallPanel();
 }catch(e){
  console.error('Réponse appel:',e);
  clearCallMedia();callDocId=null;incomingCall=null;updateCallPanel();
  alert('Réponse à l’appel impossible : '+(e.message||e));
 }
}
async function rejectCall(id){stopCallRing();try{await firestore.collection('lsd_calls').doc(id).update({status:'ended'});}catch(e){console.warn(e)}incomingCall=null;}
async function endCall(remote){stopCallRing();stopCallDuration();if(callDocId&&firestore&&!remote){try{await firestore.collection('lsd_calls').doc(callDocId).update({status:'ended'});}catch(e){console.warn(e)}}clearCallMedia();callDocId=null;incomingCall=null;callStatusText='';setCallStatus('');updateCallPanel();}

let scanTarget=null;
let scanStream=null;
let scanRAF=null;
let liveDetector=null;
let scanBusy=false;
let zxingLoaded=false;

function openNativeScanner(target){

async function loadZXing(){
  if(window.ZXingBrowser || window.ZXing) return true;
  if(zxingLoading) return zxingLoading;
  zxingLoading=new Promise(resolve=>{
    const sc=document.createElement('script');
    sc.src='https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js';
    sc.onload=()=>{zxingLoaded=!!(window.ZXingBrowser||window.ZXing);resolve(zxingLoaded);};
    sc.onerror=()=>resolve(false);
    document.head.appendChild(sc);
  });
  return zxingLoading;
}

async function startLiveScanner(target){
  scanTarget=target;
  const status=document.getElementById('scanStatus');
  const wrap=document.getElementById('liveScanWrap');
  const video=document.getElementById('liveScanVideo');
  if(!video){return;}
  if(location.protocol!=='https:' && location.hostname!=='localhost' && location.protocol!=='file:'){
    if(status)status.textContent='⚠️ Le scan automatique nécessite HTTPS. Utilisez GitHub Pages (https://).';
    document.getElementById('scanPhotoBtn').style.display='inline-block';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(status)status.textContent='⚠️ Caméra en direct indisponible. Utilisez « Prendre une photo ».';
    document.getElementById('scanPhotoBtn').style.display='inline-block';
    return;
  }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=scanStream;
    await video.play();
    wrap.style.display='flex';
    if(status)status.textContent='🔍 Scanning… placez le code-barres dans le cadre. Détection automatique.';

    if('BarcodeDetector' in window){
      try{
        liveDetector=new BarcodeDetector({formats:['code_128','code_39','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix']});
      }catch(e){liveDetector=null;}
    }
    const zxingOk=await loadZXing();
    if(!liveDetector && !zxingOk){
      if(status)status.textContent='⚠️ Aucun lecteur de code-barres compatible dans ce navigateur. Utilisez « Prendre une photo ».';
      document.getElementById('scanPhotoBtn').style.display='inline-block';
      return;
    }
    scanLoop();
  }catch(e){
    if(status)status.textContent='⚠️ Accès caméra refusé ou indisponible. Autorisez la caméra puis réessayez.';
    document.getElementById('scanPhotoBtn').style.display='inline-block';
  }
}

async function scanLoop(){
  if(!scanStream || scanBusy)return;
  const video=document.getElementById('liveScanVideo');
  try{
    scanBusy=true;
    let val='';
    if(liveDetector){
      const codes=await liveDetector.detect(video);
      if(codes && codes.length) val=(codes[0].rawValue||'');
    }
    if(!val && (window.ZXingBrowser||window.ZXing)){
      // ZXing fallback is activated through the next animation frame if native detector found nothing.
      // Native BarcodeDetector is preferred because it is faster on Android Chrome.
    }
    if(val){
      const digits=val.replace(/\D/g,'');
      if(digits.length>=10){setScannedValue(digits);return;}
    }
  }catch(e){}
  finally{scanBusy=false;}
  scanRAF=requestAnimationFrame(scanLoop);
}

function setScannedValue(val){
  const input=document.getElementById(scanTarget); if(!input)return;
  input.value=String(val).replace(/\D/g,'');
  input.dispatchEvent(new Event('input',{bubbles:true}));
  updateSaleQty();
  const status=document.getElementById('scanStatus'); if(status)status.textContent='✅ Série détectée automatiquement : '+input.value;
  setTimeout(()=>stopScanner(),700);
}

async function scanPhoto(fileInput){
  const file=fileInput && fileInput.files && fileInput.files[0];
  if(!file)return;
  const status=document.getElementById('scanStatus');
  if(status)status.textContent='🔍 Analyse automatique du code-barres…';
  try{
    if('BarcodeDetector' in window){
      const detector=new BarcodeDetector({formats:['code_128','code_39','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix']});
      const bmp=await createImageBitmap(file);
      const codes=await detector.detect(bmp);
      if(codes && codes.length){
        const v=(codes[0].rawValue||'').replace(/\D/g,'');
        if(v.length>=10){setScannedValue(v);return;}
      }
    }
  }catch(e){}
  if(status)status.textContent='❌ Code non détecté. Reprenez la photo de plus près, bien nette et sans reflet.';
}

function stopScanner(hide=true){
  if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;scanBusy=false;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  const v=document.getElementById('liveScanVideo');if(v){v.pause();v.srcObject=null;}
  const w=document.getElementById('liveScanWrap');if(w)w.style.display='none';
  const b=document.getElementById('scannerBox');if(hide&&b)b.style.display='none';
}

const HIST_DB="GestionLSD_Historique", HIST_STORE="jours";
let histDB=null;
function openHistDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(HIST_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(HIST_STORE))r.result.createObjectStore(HIST_STORE,{keyPath:"date"})};r.onsuccess=()=>{histDB=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function snapshot(){if(!histDB)return;const date=new Date().toISOString().slice(0,10);const d=total(db.debts),l=total(db.deliveries),sr=Number(db.pending||0)-l;const salesQty=(db.sales||[]).filter(x=>x.date===date).reduce((a,x)=>a+Number(x.quantity||0),0);const rec={date,stockIn:Number(db.stockIn||0),pending:Number(db.pending||0),simLivrer:l,stockRestant:sr,dettes:d,ventesLSD:salesQty,capital:Number(db.capital||0),valeurStockIn:Number(db.stockIn||0)*Number(db.unitPrice||0),valeurDette:d*Number(db.unitPrice||0),marchand1:Number(db.merchant1Amount||0),difference:Number(db.capital||0)-(sr*Number(db.unitPrice||0)+d*Number(db.unitPrice||0)+Number(db.merchant1Amount||0))};histDB.transaction(HIST_STORE,"readwrite").objectStore(HIST_STORE).put(rec)}
function allHistory(){return new Promise((resolve,reject)=>{const r=histDB.transaction(HIST_STORE).objectStore(HIST_STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
